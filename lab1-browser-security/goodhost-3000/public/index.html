<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>SecureMail Pro</title>
    <link rel="stylesheet" href="http://localhost:7000/theme.css" />
  </head>
  <body>
    <div class="logo-container">
      <img src="http://localhost:7000/logo.png" alt="logo" />
    </div>

    <div
      style="
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: end;
        margin-top: 20px;
      "
    >
      <div>
        <label for="usernameInput">Username</label><br />
        <input
          id="usernameInput"
          type="text"
          placeholder="john or alice"
          autocomplete="off"
        />
      </div>
      <button id="loginButton" type="button">Login</button>
      <button id="logoutButton" type="button">Logout</button>
    </div>

    <p id="authMessage" style="margin-top: 12px">
      Use <strong>john</strong> or <strong>alice</strong> to create a session.
    </p>
    <div style="margin-top: 8px">Logged in as: <span id="username">Guest</span></div>
    <div style="margin-top: 16px">
      <button id="scopeProbeButton" type="button">Check /other cookie scope</button>
      <pre
        id="scopeProbeResult"
        style="
          margin-top: 10px;
          padding: 12px;
          background: rgba(0, 0, 0, 0.06);
          border-radius: 8px;
          white-space: pre-wrap;
        "
      ></pre>
    </div>

    <div style="display: flex; gap: 20px; margin-top: 20px">
      <div style="width: 280px">
        <h3>Emails</h3>
        <ul id="emailList"></ul>
      </div>
      <div style="flex: 1">
        <h3 id="emailSubject">Select an email</h3>
        <div id="emailBody"></div>
      </div>
    </div>

    <script src="/main.js"></script>
    <!-- The Bridge -->
    <script
      src="http://localhost:7000/react-mock.js"
      integrity="sha256-i1StlEr0rKWT5staSN0miT7gCYj5orUZOvo2FEo0NUg="
      crossorigin="anonymous"
    ></script>
    <script src="http://localhost:4000/support.js"></script>
    <script src="http://localhost:5000/weather.js"></script>
  </body>
</html>
